allowBuilds:
  "@prisma/engines": true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  kysely: "0.28.17"
  # Security fixes for transitive dependencies whose parents pin vulnerable
  # versions (prisma CLI, ajv, jsdom, concurrently, pino-pretty, Stryker).
  deepmerge-ts: "^8.0.2"
  fast-copy: "^4.1.0"
  fast-uri: "^3.1.8"
  mysql2: "^3.24.6"
  qs: "6.16.0"
  shell-quote: "^1.11.0"
  source-map-js: "^1.2.2"
  undici: "^8.10.2"
